[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurobci"
version = "0.1.0"
description = "Real-time EEG / BCI research platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "mne>=1.7",
    "pyriemann>=0.6",
    "pylsl>=1.16",
    "PyQt5>=5.15",
    "pyqtgraph>=0.13",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
neurobci = "neurobci.ui.app:main"

[tool.setuptools.packages.find]
include = ["neurobci*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
